<!doctype html>
<meta charset="utf-8">
<title>icon generator</title>
<!-- Renders the app icon from the game's own hen art.
     Open as scripts/icon.html?size=512[&maskable] (served from the repo root) and screenshot the canvas. -->
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
import { drawHenBody, drawHenWing, WING_PIVOT } from '../src/render/hen.js';
const q = new URLSearchParams(location.search);
const size = +q.get('size') || 512;
const maskable = q.has('maskable');
const c = document.getElementById('c');
c.width = c.height = size;
const x = c.getContext('2d');
const g = x.createRadialGradient(size * 0.5, size * 0.35, size * 0.05, size * 0.5, size * 0.5, size * 0.8);
g.addColorStop(0, '#6a2fd0');
g.addColorStop(0.55, '#26104f');
g.addColorStop(1, '#0b0722');
x.fillStyle = g;
x.fillRect(0, 0, size, size);
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 40; i++) {
  x.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.6})`;
  const r = size * (0.003 + rnd() * 0.005);
  x.beginPath();
  x.arc(rnd() * size, rnd() * size, r, 0, 7);
  x.fill();
}
// the hen, centred; maskable icons keep it inside the safe zone (~60%)
const k = (size * (maskable ? 0.6 : 0.82)) / 560;
x.save();
x.translate(size / 2 - 280 * k, size / 2 - 240 * k + size * 0.02);
x.scale(k, k);
for (const s of [1, -1]) {
  x.save();
  x.translate(280 - s * (280 - WING_PIVOT.x), WING_PIVOT.y);
  x.scale(s, 1);
  x.rotate(0.12 * s * 0);
  drawHenWing(x);
  x.restore();
}
drawHenBody(x, 'red', { lookX: 0, lookY: 0.4, anger: 1.3 });
x.restore();
</script>
